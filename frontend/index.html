    <!-- The prerendered copy is for crawlers and no-JS visitors. It stays in the DOM but is
         visually hidden, so JS users never see it flash before React mounts and replaces it. -->
    <style>
      .prerender { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
